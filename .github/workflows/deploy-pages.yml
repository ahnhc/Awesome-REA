name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    if: ${{ github.repository == 'ahnhc/Awesome-REA' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate and build upstream catalog
        run: python3 scripts/build_production.py
      - name: Adapt and verify the Pages project site
        run: |
          python3 -m unittest tests.test_github_pages tests.test_review_dispatch tests.test_merge_pr tests.test_discovery_ingest -v
          python3 scripts/build_github_pages.py
          python3 -m compileall -q scripts tests
          find dist/assets -name '*.js' -exec node --check {} \;
      - name: Check the mounted site in Chrome
        run: |
          npm ci --prefix tests/browser --ignore-scripts
          node tests/browser/github-pages.cjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
